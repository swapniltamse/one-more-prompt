# /chill config — copy this to config.yaml and fill in your details
# Run /chill setup for an interactive wizard instead

name: YourName
language: hi                        # single language — hi | ar | ta | kn | mr | es | pt | en-ie | en
# languages: [hi, mr, en]           # OR pick multiple — one is chosen at random each fire
timezone: America/New_York          # IANA timezone string

thresholds:
  - time: "21:00"   # 9pm   — tier 1: gentle nudge
  - time: "23:00"   # 11pm  — tier 2: firmer
  - time: "01:00"   # 1am   — tier 3: no more jokes

snooze_minutes: 30

# Optional: calendar awareness
# Requires Google Calendar MCP connected to your Claude account
# For auto-fire: run scripts/fetch_calendar.sh on a schedule to populate the cache
calendar: false

# Path to your Obsidian Claude Sessions folder (leave empty to disable logging)
obsidian_log: ""

# Optional: use a different LLM CLI for message generation (default: claude -p)
# The command receives the prompt as its last argument.
# Examples:
#   model_cmd: "llm"                        # Simon Willison's llm tool
#   model_cmd: "sgpt"                       # shell-gpt
#   model_cmd: "ollama run llama3"          # local Ollama model
#   model_cmd: "gemini -p"                  # Gemini CLI
# model_cmd: ""
