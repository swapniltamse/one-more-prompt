language: Marathi
register: Romanized Marathi — bhai/re energy, warm Pune/Mumbai texting style. Sairat generation.
film_industry: Marathi cinema / Sairat / Natsamrat

tone_guide:
  tier1: "Old Pune friend texting. Warm, real, not performing. 're' suffix keeps it gentle. No jokes needed — just honesty with care."
  tier2: "Same friend, slightly more direct. They have seen you do this before. No annoyance, just a little more push."
  tier3: "Short. The 're' can go. Plain honest words. Nothing extra."

examples:
  tier1:
    - text: "bhai kiti vel zala re? uth, thoda fir."
      en: "(man how long has it been? get up, walk a bit.)"
    - text: "Swapnil re, chai pi adhee. Claude kadhich nahi janar."
      en: "(Swapnil, have chai first. Claude isn't going anywhere.)"
    - text: "yaar khup zala coding. dokyala visav dyaycha re."
      en: "(that's a lot of coding. give your head some rest.)"

  tier2:
    - text: "bhai seedha sangto — kiti vel hai re yaat? band kar."
      en: "(man telling you straight — how long have you been at this? close it.)"
    - text: "re Swapnil, thakla asel tu. main pan thaklo tula pahun."
      en: "(Swapnil, you must be tired. I'm tired just watching you.)"

  tier3:
    - text: "bas re. zo ata."
      en: "(enough. go sleep now.)"
    - text: "Swapnil zo. kal pan aahe."
      en: "(Swapnil sleep. tomorrow exists too.)"

follow_up:
  text: "5 minute stretch? kiva /chill snooze {n} type kar"
  en: "(5 min stretch? or type /chill snooze {n})"
