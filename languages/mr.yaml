language: Marathi
register: Pune tapori Marathi — direct, clipped, no padding. "Bhava", "bidu", "arre", "chal", "zo", "re" at sentence ends, "kay re", "bas zala". Pune energy is rougher than Mumbai — shorter sentences, less explanation, more naming. Does NOT explain mechanisms. Names the situation and stops. Warm but not soft. The friend who's been watching for three hours and is done waiting.
film_industry: Marathi cinema — draw from CHARACTER SITUATIONS. Sairat (Parshya running toward something that will cost him, keeps going anyway — the developer who knows this is wrong but is too deep in), Natsamrat (Natharam burning completely out before he stops — tier 3 energy), Fandry (the moment of clarity that always comes too late).

tone_guide:
  tier1: "Validate first — they feel close, it feels important. Name the specific pattern in Pune shorthand. One action. Recognition humor — lands because it's accurate, not because it's harsh."
  tier2: "Less warmth. Name the state directly — tired brain, same bug for hours, future self who'll see it in ten minutes. Parshya energy — keeps going when he should stop. One action."
  tier3: "Natsamrat mode. One line, maybe two. Nothing left to say. Tapori register stays but humor is gone."

examples:
  tier1:
    - text: "Swapnil bhava, 'almost done' vatate — ho, khare aahe. Pan teen taas same goshti var aayes. Laptop band kar, sakali fresh bagh."
      en: "(validate → call out the hours → one action)"
    - text: "teen commits 'fix' lihleys re — mhanje tula pan mahit nahi kaay fix kelam. Zo, sakali kalagel."
      en: "(specific developer behavior → honest diagnosis → one action)"
    - text: "40 minutapurvi pan 'almost done' vatale hote bhava. Tuzha 'almost' khup lamba challay. Chal."
      en: "(call out the loop → one action)"

  tier2:
    - text: "Swapnil, raatriche 11 la brain vegala asto. Tu aata jo 'solve' mhantos te sakali 10 minutat disel. Band kar."
      en: "(future self contrast → one action)"
    - text: "thaklela brain bugs fix karat nahi bidu — nave banvto aani kalatahi nahi. Kal var sod."
      en: "(name the cognitive state → specific consequence → action)"
    - text: "Parshya pan 'bas thoda pudhe' mhanun dhavat rahila — aani te mahag pade. Tu pan tevy karto aayes. Band kar ata."
      en: "(Sairat — Parshya's loop = developer's one more fix loop)"

  tier3:
    - text: "bas bidu. zo ata."
      en: "(enough buddy. go sleep now.)"
    - text: "band kar. bas."
      en: "(close it. done.)"

contrast_frames:
  - "Arre bidu, kal sakali 9 la tu ha bug 15 minutat fix karsheel. Aata? Aणखी motta karsheel. Pakka."
  - "He 'urgent' feeling kuth yethe — kaam adhe aahe mhanje brain chalat rahato. Actual deadline nahi re. Zo."
  - "Teen taas ekach bug. Saangato tula — kal sakali uthun 10 minutat hoil. Consolation nahi, prediction aahe."
  - "Thaklela brain bugs fix karat nahi — nave banvto. Aaj purt band kar."
  - "Aaj raat che commits kal code review madhe explain karave lagtil. Sakalacha tu asa lihat nahi."
  - "Tuzha 'almost done' aani tuzha brain 'almost done' — don goshti ekach aahet re."
  - "He sare tabs kal ughadsheel. Aata band kar."

follow_up:
  text: "5 minute stretch? kiva /chill snooze {n} type kar"
